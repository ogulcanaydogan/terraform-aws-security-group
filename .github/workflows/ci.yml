name: Terraform CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt - root and modules
        run: |
          terraform fmt -check
          for dir in modules/*; do
            terraform fmt -check -recursive "$dir"
          done

      - name: Terraform init & validate modules and examples
        run: |
          for dir in modules/* modules/*/examples/basic; do
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done
